[ESP32_S3_N16R8_SX1262]
extends = esp32_base
board = ESP32-S3-WROOM-1-N16R8-SX1262
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32s3_n16r8_sx1262
  -D ESP32_S3_N16R8_SX1262
  -D BOARD_HAS_PSRAM
  -D P_LORA_SCLK=38
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=40
  -D P_LORA_NSS=41
  -D P_LORA_BUSY=42
  -D P_LORA_DIO_1=47
  -D P_LORA_RESET=21
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32s3_n16r8_sx1262>
lib_deps =
  ${esp32_base.lib_deps}

[env:ESP32_S3_N16R8_SX1262_repeater]
extends = ESP32_S3_N16R8_SX1262
build_flags =
  ${ESP32_S3_N16R8_SX1262.build_flags}
  -D ADVERT_NAME='"ESP32-S3 SX1262 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${ESP32_S3_N16R8_SX1262.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${ESP32_S3_N16R8_SX1262.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32_S3_N16R8_SX1262_room_server]
extends = ESP32_S3_N16R8_SX1262
build_flags =
  ${ESP32_S3_N16R8_SX1262.build_flags}
  -D ADVERT_NAME='"ESP32-S3 SX1262 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${ESP32_S3_N16R8_SX1262.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${ESP32_S3_N16R8_SX1262.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32_S3_N16R8_SX1262_terminal_chat]
extends = ESP32_S3_N16R8_SX1262
build_flags =
  ${ESP32_S3_N16R8_SX1262.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${ESP32_S3_N16R8_SX1262.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${ESP32_S3_N16R8_SX1262.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32_S3_N16R8_SX1262_companion_radio_usb]
extends = ESP32_S3_N16R8_SX1262
build_flags =
  ${ESP32_S3_N16R8_SX1262.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${ESP32_S3_N16R8_SX1262.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_N16R8_SX1262.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32_S3_N16R8_SX1262_companion_radio_ble]
extends = ESP32_S3_N16R8_SX1262
build_flags =
  ${ESP32_S3_N16R8_SX1262.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${ESP32_S3_N16R8_SX1262.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_N16R8_SX1262.lib_deps}
  densaugeo/base64 @ ~1.4.0